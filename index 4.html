<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">

    <header class="header">
      <div class="stamp">✉</div>
      <div class="header-text">
        <h1>ATM Assistant</h1>
        <p>Ask anything. Especially sharp on email marketing.</p>
      </div>
    </header>

    <section class="chat-panel">

      <!-- Messages get added here one by one by script.js -->
      <div id="chatLog" class="chat-log" aria-live="polite">
        <div class="message assistant">
          <div class="bubble">Hey — I'm your assistant. Ask me anything, or throw a marketing problem at me and I'll go deep.</div>
        </div>
      </div>

      <form id="chatForm" class="chat-input-row">
        <textarea
          id="userInput"
          rows="1"
          placeholder="Type a message…"
        ></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>

    </section>

    <footer class="footer">
      <p>Stage 1 build — conversation resets on refresh.</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
