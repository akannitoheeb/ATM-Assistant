<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — ATM Assistant</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="login-box" style="max-width: 380px; margin: 80px auto;">
    <img src="/atm-icon-white-512.png" alt="ATM" style="width:40px; height:40px;">
    <h1>Set a new password</h1>
    <p id="resetSubtext">Enter a new password for your account.</p>

    <form id="resetForm" class="auth-form">
      <div class="password-field">
        <input type="password" id="newPassword" placeholder="New password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" id="resetSubmitBtn" class="login-btn">Update password</button>
    </form>

    <p id="resetMessage" class="auth-error hidden"></p>
  </div>

  <script>
    // Replace these two with the exact same values used in script.js
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseAnonKey = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    const resetForm = document.getElementById('resetForm');
    const resetMessage = document.getElementById('resetMessage');
    const resetSubmitBtn = document.getElementById('resetSubmitBtn');

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;

      resetSubmitBtn.disabled = true;
      resetSubmitBtn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      resetSubmitBtn.disabled = false;
      resetSubmitBtn.textContent = 'Update password';

      if (error) {
        resetMessage.textContent = error.message;
        resetMessage.classList.remove('hidden');
        resetMessage.style.color = '#e5484d';
      } else {
        resetMessage.textContent = 'Password updated. Redirecting to sign in...';
        resetMessage.classList.remove('hidden');
        resetMessage.style.color = '#4CAF50';
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      }
    });
  </script>

</body>
</html>
