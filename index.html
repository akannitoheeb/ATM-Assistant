<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATM Assistant, AI Chat Assistant for Email Marketing</title>

  <!-- ===================== SEO ===================== -->
  <meta name="description" content="ATM Assistant is an AI chat assistant sharp on email marketing — built by Toheeb Akanni. Ask anything, get answers grounded in real marketing strategy." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://assistant.toheebakanni.name.ng/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ATM Assistant — AI Chat Assistant for Email Marketing" />
  <meta property="og:description" content="An AI chat assistant sharp on email marketing, built by Toheeb Akanni." />
  <meta property="og:url" content="https://assistant.toheebakanni.name.ng/" />
  <!-- Add an og:image once you have a 1200x630 preview banner:
  <meta property="og:image" content="https://assistant.toheebakanni.name.ng/preview.png" /> -->

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ATM Assistant" />
  <meta name="twitter:description" content="An AI chat assistant sharp on email marketing." />

  <meta name="theme-color" content="#131A26" />
  <!-- =================================================== -->

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- TEMPORARY — an on-screen developer console so we can see real
       errors on your phone. Safe to remove once we're done debugging.
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>  -->
</head>
<body>

  <!-- ===================== LOGIN GATE ===================== -->
  <div id="loginGate" class="login-gate">
    <div class="login-box">
      <div class="stamp-mark">✉</div>
      <h1>ATM Assistant</h1>
      <p id="authSubtext">Sign in to save your chats and settings to your account.</p>

      <form id="authForm" class="auth-form">
        <input type="email" id="authEmail" placeholder="Email" required autocomplete="email" />

        <div class="password-field">
          <input type="password" id="authPassword" placeholder="Password" required autocomplete="current-password" />
          <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Show password">👁</button>
        </div>

        <button type="submit" id="authSubmitBtn" class="login-btn">Log in</button>
      </form>
      <div class="auth-divider"><span>or</span></div>

      <button type="button" id="googleAuthBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c10.2 0 19-7.4 19-20 0-1.3-.2-2.3-.4-3z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/>
          <path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 34.7 26.7 35.5 24 35.5c-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.5 39.1 16.2 43.5 24 43.5z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.6l6.2 5.2C40.7 36 44 30.5 44 24c0-1.3-.2-2.3-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>
      <p class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span>
        <button id="authToggleBtn" class="link-btn" type="button">Sign up</button>
      </p>

      <p id="authError" class="auth-error hidden"></p>
    </div>
  </div>

  <div class="app hidden" id="appRoot">

    <!-- Only visible on small screens — opens the sidebar -->
    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu">☰</button>

    <!-- Only visible on small screens when sidebar is open — tap to close -->
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark">✉</span>
          <span class="brand-name">ATM</span>
        </div>
        <button id="newChatBtn" class="new-chat-btn">
          <span class="plus">+</span> New chat
        </button>
      </div>

      <nav class="chat-history">
        <div class="history-label">Recent</div>
        <!-- Past chat entries get inserted here by script.js -->
        <div id="historyList"></div>
      </nav>

      <div class="sidebar-bottom">
        <button id="settingsBtn" class="settings-btn">
          <span class="gear">⚙</span> Settings
        </button>
        <div class="account-block">
          <div class="account-row">
            <div class="user-avatar-wrap">
              <img id="userAvatarImg" class="user-avatar-img hidden" alt="" />
              <span id="userAvatarInitial" class="user-avatar-initial">…</span>
            </div>
            <span id="userEmail" class="user-tag">…</span>
          </div>
          <button id="logoutBtn" class="logout-link">Log out</button>
        </div>
      </div>
    </aside>

    <!-- ===================== SETTINGS MODAL ===================== -->
    <div id="settingsOverlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="closeSettingsBtn" class="modal-close" aria-label="Close">✕</button>
        </div>

        <div class="modal-body">
          <label class="field-label" for="toneSelect">Tone</label>
          <select id="toneSelect">
            <option value="friendly and warm">Friendly & warm</option>
            <option value="direct and professional">Direct & professional</option>
            <option value="playful and energetic">Playful & energetic</option>
            <option value="premium and understated">Premium & understated</option>
          </select>

          <label class="checkbox-row">
            <input type="checkbox" id="nigeriaToggle" checked />
            <span>Emphasize Nigerian market context in marketing answers</span>
          </label>

          <label class="field-label" for="customInstruction">Extra instructions (optional)</label>
          <textarea
            id="customInstruction"
            rows="3"
            placeholder="e.g. Keep replies short. Always suggest 3 options, not 5."
          ></textarea>
        </div>

        <div class="modal-footer">
          <button id="saveSettingsBtn" class="save-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- ===================== MAIN AREA ===================== -->
    <main class="main">

      <!-- Shown only when there's no active conversation yet -->
      <div id="greetingState" class="greeting-state">
        <div class="greeting-mark">✉</div>
        <h1>What can I help with?</h1>
        <p class="greeting-sub">Ask anything, especially sharp on email marketing.</p>
      </div>

      <!-- Shown once a conversation starts -->
      <div id="chatLog" class="chat-log"></div>

      <form id="chatForm" class="chat-input-row">
        <button type="button" id="attachBtn" class="attach-btn" aria-label="Attach file">+</button>
        <input type="file" id="fileInput" accept="image/*,.txt,.md,.csv" hidden />
        <div class="input-stack">
          <div id="attachmentPreview" class="attachment-preview hidden"></div>
          <textarea
            id="userInput"
            rows="1"
            placeholder="Message ATM Assistant…"
          ></textarea>
        </div>
        <button type="submit" id="sendBtn" aria-label="Send">↑</button>
      </form>

    </main>

  </div>

  <script src="script.js?v=11"></script>
</body>
</html>
